# Streamlit app config. Colors/fonts match the Rebloom Figma file; the rest of the
# look lives in ui.py (injected CSS).
[theme]
primaryColor = "#C2416B"
backgroundColor = "#FFF5F3"
secondaryBackgroundColor = "#EDE3F5"
textColor = "#3D2A3A"
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
baseRadius = "full"

[server]
headless = true
